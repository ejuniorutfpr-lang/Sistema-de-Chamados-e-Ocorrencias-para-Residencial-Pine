name: CI/CD - Testes Automáticos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: 💾 Cache pnpm
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: 📦 Instalar dependências
        run: pnpm install --frozen-lockfile
      
      - name: 🔍 TypeScript Check
        run: pnpm check
      
      - name: 🧪 Rodar testes
        run: pnpm test
      
      - name: 📊 Upload coverage (opcional)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: 💾 Cache pnpm
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: 📦 Instalar dependências
        run: pnpm install --frozen-lockfile
      
      - name: 🎨 Prettier check
        run: pnpm format --check

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: 💾 Cache pnpm
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: 📦 Instalar dependências
        run: pnpm install --frozen-lockfile
      
      - name: 🔨 Build
        run: pnpm build
      
      - name: ✅ Build bem-sucedido
        run: echo "✅ Build completo e pronto para deploy!"
